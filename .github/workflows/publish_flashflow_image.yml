name: Publish FlashFlow Evolution image

on:
  push:
    tags:
      - "2.3.7-buttons.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag
        required: true
        default: 2.3.7-buttons.2

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/thiago-caffaro/evolution-api-flashflow:${{ inputs.image_tag || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
